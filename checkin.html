<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錦葳 - 即時調理資料產生</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .signature-container { 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      background: #fff; 
      margin-bottom: 10px; 
      overflow: hidden; 
      touch-action: none; 
    }
    
    #signaturePad { 
      width: 100%; 
      height: 150px; 
      display: block; 
      cursor: crosshair; 
    }

    .preview-container {
      width: 100%;
      min-height: 100px;
      border: 1px dashed var(--primary-color);
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--secondary-bg);
      cursor: pointer;
      overflow: hidden;
    }
    
    .preview-container img {
      width: 100%;
      height: auto;
      display: none;
    }
    
    .preview-text {
      color: var(--primary-color);
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none; 
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      width: 95%;
      max-width: 500px;
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    
    .canvas-wrapper { 
      position: relative; 
      width: 100%; 
      height: 400px; 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      margin-bottom: 15px; 
      overflow: hidden; 
      touch-action: none; 
      background: #fff; 
    }
    
    #bodyMapCanvas { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      cursor: crosshair; 
    }
    
    .modal-actions {
      display: flex;
      gap: 10px;
    }
    
    .modal-actions button {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="./logo.png" alt="錦葳">
    </div>
    
    <div class="card">
      <h3>自助報到與同意書</h3>
      <p id="bookingInfo" style="font-size:14px; color:var(--text-muted);"></p>

      <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 20px 0;">
      
      <p style="font-size: 14px; font-weight: bold; color: var(--primary-color);">【基本狀況確認】(若有變更請直接修改)</p>
      
      <label>1. 職業 (有助於分析勞損部位)</label>
      <input type="text" id="chkOccupation" placeholder="例如：辦公室行政、業務、工地主任...">
      
      <label>2. 病史與開刀史 (防呆：若無請填無)</label>
      <input type="text" id="chkMedicalHistory" placeholder="例如：盲腸炎開刀... (若無請填寫「無」)">

      <label>3. 需避開調理的部位 (防呆：若無請填無)</label>
      <input type="text" id="chkAvoidAreas" placeholder="例如：右膝蓋有傷... (若無請填寫「無」)">

      <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 20px 0;">

      <p style="font-size: 14px; font-weight: bold; color: var(--primary-color);">【今日調理需求】</p>

      <label>4. 人體圖註記 (請點擊下方開啟畫板，圈出須加強部位)</label>
      <div class="preview-container" id="bodyMapPreviewBtn" onclick="openDrawingModal()">
        <span class="preview-text" id="previewText">點擊開啟人體圖畫板 ✍️</span>
        <img id="bodyMapResultImg" alt="人體圖預覽">
      </div>

      <label>5. 本次欲加強調理的部位 (文字補充)</label>
      <input type="text" id="chkFocusAreas" placeholder="例如：肩頸緊繃、下背痠痛...">
      
      <label>6. 近期新增意外撞擊、跌倒情況？ (防呆：若無請填無)</label>
      <input type="text" id="chkRecentAccidents" placeholder="例如：上週跌倒... (若無請填寫「無」)">
      
      <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 20px 0;">
      
      <label>本人同意並確認上述填寫狀況屬實：(請簽名)</label>
      <div class="signature-container">
        <canvas id="signaturePad"></canvas>
      </div>
      <button class="btn-small btn-secondary" onclick="clearSignature()" style="margin-bottom: 15px;">清除重簽</button>
      
      <button onclick="submitCheckIn()">確認送出報到資料</button>
      <button class="btn-secondary" onclick="window.history.back()">返回上一頁</button>
    </div>
  </div>

  <div class="modal-overlay" id="drawingModal">
    <div class="modal-content">
      <h3 style="text-align: center; margin-bottom: 10px;">請圈選須加強或避開之處</h3>
      <div class="canvas-wrapper">
        <canvas id="bodyMapCanvas"></canvas>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="clearBodyMap()">清除重畫</button>
        <button onclick="closeAndSaveDrawing()">完成圈選</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwApGqvuUMuERNtrlEr1NHSKxooH_fD9XF_t1v-iKg_gDJ0kRBqnrKodhjVlIWa-u16sw/exec";
    
    // 解析網址上的預約資訊
    const urlParams = new URLSearchParams(window.location.search);
    const bookingTime = urlParams.get('time');
    const serviceType = urlParams.get('service');
    
    // 從暫存提取會員資料
    const profileJson = sessionStorage.getItem("jwProfile");
    if (!profileJson) {
      alert("讀取會員資料失敗，請重新登入！");
      window.location.href = "index.html";
    }
    
    const profile = JSON.parse(profileJson);
    const memberId = profile.id;
    const memberName = profile.name;

    document.getElementById('bookingInfo').innerHTML = `會員：${memberName} (${memberId})<br>預約：${bookingTime} - ${serviceType}`;

    let bodyMap;
    let sigPad;
    let bodyImg;
    let isBodyMapDrawn = false; 

    window.onload = function() {
      // 自動帶入半永久資料
      document.getElementById("chkOccupation").value = profile.occupation || "";
      document.getElementById("chkMedicalHistory").value = profile.medHistory || "";
      document.getElementById("chkAvoidAreas").value = profile.avoidAreas || "";

      sigPad = setupCanvas('signaturePad', false);
      
      bodyImg = new Image();
      bodyImg.src = 'body_map.jpg'; 
    };

    function setupCanvas(canvasId, isImageBg = false) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width || 400; 
      canvas.height = rect.height || (isImageBg ? 400 : 150);
      
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = isImageBg ? '#E74C3C' : '#000'; 

      let isDrawing = false;

      const getPos = (e) => {
        const r = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
        } else {
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }
      };

      const start = (e) => { 
        e.preventDefault(); 
        isDrawing = true; 
        const p = getPos(e); 
        ctx.beginPath(); 
        ctx.moveTo(p.x, p.y); 
      };
      
      const draw = (e) => { 
        e.preventDefault(); 
        if (!isDrawing) return; 
        const p = getPos(e); 
        ctx.lineTo(p.x, p.y); 
        ctx.stroke(); 
      };
      
      const stop = () => { 
        isDrawing = false; 
        ctx.closePath(); 
      };

      canvas.addEventListener('mousedown', start); 
      canvas.addEventListener('mousemove', draw); 
      canvas.addEventListener('mouseup', stop); 
      canvas.addEventListener('mouseout', stop);
      
      canvas.addEventListener('touchstart', start, { passive: false }); 
      canvas.addEventListener('touchmove', draw, { passive: false }); 
      canvas.addEventListener('touchend', stop);

      return { canvas, ctx };
    }

    function openDrawingModal() {
      const modal = document.getElementById('drawingModal');
      modal.style.display = 'flex';
      
      document.body.style.overflow = 'hidden';

      if (!bodyMap) {
        bodyMap = setupCanvas('bodyMapCanvas', true);
      }
      
      if (!isBodyMapDrawn) {
        drawBodyMapBg();
      }
    }

    function drawBodyMapBg() {
      if(bodyMap && bodyImg.complete) {
        bodyMap.ctx.clearRect(0, 0, bodyMap.canvas.width, bodyMap.canvas.height);
        bodyMap.ctx.drawImage(bodyImg, 0, 0, bodyMap.canvas.width, bodyMap.canvas.height);
      }
    }
    
    function clearBodyMap() { 
      drawBodyMapBg(); 
      isBodyMapDrawn = false;
    }
    
    function closeAndSaveDrawing() {
      const modal = document.getElementById('drawingModal');
      modal.style.display = 'none';
      document.body.style.overflow = 'auto'; 

      const previewImg = document.getElementById('bodyMapResultImg');
      const previewText = document.getElementById('previewText');
      
      previewImg.src = bodyMap.canvas.toDataURL('image/jpeg', 0.8);
      previewImg.style.display = 'block';
      previewText.style.display = 'none'; 
      
      isBodyMapDrawn = true;
    }

    function clearSignature() { 
      sigPad.ctx.clearRect(0, 0, sigPad.canvas.width, sigPad.canvas.height); 
    }

    function isCanvasBlank(canvas) {
      const blank = document.createElement('canvas');
      blank.width = canvas.width; 
      blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    }

    function generateRandomCode() { 
      return Math.random().toString(36).substring(2, 10).toUpperCase(); 
    }

    function submitCheckIn() {
      const occupation = document.getElementById("chkOccupation").value.trim();
      const medHistory = document.getElementById("chkMedicalHistory").value.trim();
      const avoidAreas = document.getElementById("chkAvoidAreas").value.trim();
      const focusAreas = document.getElementById("chkFocusAreas").value.trim();
      const recentAcc = document.getElementById("chkRecentAccidents").value.trim();

      if (!isBodyMapDrawn) { 
        Swal.fire('提示', '請點擊開啟畫板，在人體圖上進行圈選標記！', 'warning'); 
        return; 
      }
      
      if (!medHistory || !recentAcc || !avoidAreas || !focusAreas) { 
        Swal.fire('提示', '請確實填寫文字欄位，若無該狀況請手動輸入「無」喔！', 'warning'); 
        return; 
      }
      
      if (isCanvasBlank(sigPad.canvas)) { 
        Swal.fire('提示', '請在下方空白處簽名確認！', 'warning'); 
        return; 
      }

      Swal.fire({ 
        title: '生成表單中...', 
        text: '正在加密儲存您的報到資料', 
        allowOutsideClick: false, 
        didOpen: () => { 
          Swal.showLoading(); 
        } 
      });

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = 800; 
      finalCanvas.height = 1400;
      const fCtx = finalCanvas.getContext('2d');

      fCtx.fillStyle = '#FFFFFF'; 
      fCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
      
      fCtx.fillStyle = '#333333'; 
      fCtx.font = 'bold 32px Arial'; 
      fCtx.fillText('錦葳 自助報到與同意書', 40, 60);
      
      fCtx.font = '24px Arial';
      fCtx.fillText(`會員編號：${memberId}`, 40, 120);
      fCtx.fillText(`會員姓名：${memberName}`, 40, 160);
      fCtx.fillText(`預約服務：${serviceType}`, 40, 200);

      // 基本資料
      fCtx.font = 'bold 20px Arial'; 
      fCtx.fillText('職業：', 40, 250);
      fCtx.font = '20px Arial'; 
      fCtx.fillText(occupation, 120, 250);

      fCtx.font = 'bold 20px Arial'; 
      fCtx.fillText('病史與開刀史：', 40, 290);
      fCtx.font = '20px Arial'; 
      fCtx.fillText(medHistory, 200, 290);

      fCtx.font = 'bold 20px Arial'; 
      fCtx.fillText('需避開部位：', 40, 330);
      fCtx.font = '20px Arial'; 
      fCtx.fillText(avoidAreas, 180, 330);

      // 人體圖
      fCtx.drawImage(bodyMap.canvas, 40, 360, 720, 360);

      // 當次需求
      fCtx.font = 'bold 20px Arial'; 
      fCtx.fillText('本次欲加強部位：', 40, 770);
      fCtx.font = '20px Arial'; 
      fCtx.fillText(focusAreas, 220, 770);

      fCtx.font = 'bold 20px Arial'; 
      fCtx.fillText('近期新增意外撞擊、跌倒情況：', 40, 810);
      fCtx.font = '20px Arial'; 
      fCtx.fillText(recentAcc, 340, 810);

      // 簽名
      fCtx.font = 'bold 22px Arial'; 
      fCtx.fillText('本人同意並確認上述填寫狀況屬實，特此簽名：', 40, 880);
      fCtx.drawImage(sigPad.canvas, 40, 900, 400, 150);

      // 浮水印
      const now = new Date();
      const localISOTime = (new Date(now.getTime() - now.getTimezoneOffset() * 60000)).toISOString().slice(0, 19).replace('T', ' ');
      const randomCode = generateRandomCode();

      fCtx.fillStyle = '#999999'; 
      fCtx.font = '16px Arial';
      fCtx.fillText(`認證時間：${localISOTime}`, 500, 1070);
      fCtx.fillText(`認證序號：${randomCode}`, 500, 1100);

      const base64Image = finalCanvas.toDataURL('image/jpeg', 0.8);

      fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ 
          action: "submitCheckIn", 
          memberId: memberId, 
          memberName: memberName, 
          base64Image: base64Image, 
          randomCode: randomCode,
          occupation: occupation,
          medHistory: medHistory,
          avoidAreas: avoidAreas,
          focusAreas: focusAreas,
          recentAcc: recentAcc
        }) 
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          Swal.fire('報到成功', '已為您完成本次報到手續！', 'success').then(() => { 
            window.location.href = 'index.html'; 
          });
        } else { 
          Swal.fire('錯誤', data.message, 'error'); 
        }
      })
      .catch(err => {
        Swal.fire('錯誤', '網路連線異常，請稍後再試。', 'error');
      });
    }
  </script>
</body>
</html>
