<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錦葳專屬會員系統</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --bg-color: #F8F6F1; 
      --card-bg: #FFFFFF; 
      --primary-color: #B9936C; 
      --primary-hover: #9E7A55;
      --text-main: #4A3B32; 
      --text-muted: #8C7B70; 
      --border-color: #E2D3C5; 
      --secondary-bg: #EFE4DA;
      --green-light: #4CAF50; 
      --blue-light: #3498DB; 
      --yellow-light: #F39C12; 
      --red-light: #E74C3C;
    }
    
    body { 
      font-family: '微軟正黑體', sans-serif; 
      background-color: var(--bg-color); 
      margin: 0; 
      padding: 15px; 
      color: var(--text-main); 
    }
    
    .container { 
      max-width: 500px; 
      margin: 0 auto; 
    }
    
    .logo-container { 
      text-align: center; 
      margin-bottom: 20px; 
    }
    
    .logo-container img { 
      max-width: 160px; 
      height: auto; 
    }
    
    .card { 
      background: var(--card-bg); 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 10px rgba(139, 111, 88, 0.1); 
    }
    
    h2, h3 { 
      margin-top: 0; 
      color: var(--text-main); 
    }
    
    input, select, textarea, button { 
      width: 100%; 
      padding: 12px; 
      margin-bottom: 15px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      box-sizing: border-box; 
      font-size: 16px; 
      color: var(--text-main); 
      background: #faf8f5;
    }
    
    input:focus, select:focus, textarea:focus { 
      outline: none; 
      border-color: var(--primary-color); 
    }
    
    textarea { 
      resize: vertical; 
      font-family: inherit; 
    } 
    
    button { 
      background-color: var(--primary-color); 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      transition: 0.3s; 
    }
    
    button:hover { 
      background-color: var(--primary-hover); 
    }
    
    .btn-secondary { 
      background-color: var(--secondary-bg); 
      color: var(--text-main); 
      border: 1px solid var(--primary-color); 
    }
    
    .btn-secondary:hover { 
      background-color: var(--border-color); 
    }
    
    .btn-small { 
      padding: 6px 12px; 
      font-size: 13px; 
      margin-bottom: 0; 
      width: auto; 
      display: inline-block; 
      border-radius: 6px; 
    }
    
    .btn-outline { 
      background: transparent; 
      color: var(--primary-color); 
      border: 1px solid var(--primary-color); 
    }
    
    .badge { 
      display: inline-block; 
      padding: 4px 10px; 
      background: var(--secondary-bg); 
      color: var(--text-main); 
      border-radius: 6px; 
      font-size: 13px; 
      font-weight: bold; 
      border: 1px solid var(--primary-color); 
    }
    
    .hidden { 
      display: none !important; 
    }
    
    /* 調整頁籤為一排 4 個 */
    .tabs { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 20px; 
      background: var(--card-bg); 
      border-radius: 12px; 
      padding: 5px; 
      box-shadow: 0 2px 5px rgba(139, 111, 88, 0.1); 
    }
    
    .tab-btn { 
      flex: 1; 
      background: transparent; 
      color: var(--text-muted); 
      border: none; 
      margin-bottom: 0; 
      padding: 10px 2px; 
      border-radius: 8px; 
      font-size: 14px;
    }
    
    .tab-btn.active { 
      background: var(--primary-color); 
      color: white; 
    }
    
    .record-item { 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 15px; 
      margin-bottom: 15px; 
    }
    
    .record-item:last-child { 
      border-bottom: none; 
      margin-bottom: 0; 
      padding-bottom: 0; 
    }
    
    .info-row { 
      display: flex; 
      margin: 10px 0; 
      font-size: 15px; 
    }
    
    .info-label { 
      width: 80px; 
      color: var(--text-muted); 
      font-weight: bold; 
    }
    
    .info-value { 
      flex: 1; 
      color: var(--text-main); 
      font-weight: 500; 
    }
    
    .datetime-group { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 15px; 
    }
    
    .datetime-group input, .datetime-group select { 
      flex: 1; 
      margin-bottom: 0; 
    }

    .booking-box { 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      padding: 12px; 
      margin-bottom: 12px; 
      background: #faf8f5; 
      position: relative; 
      overflow: hidden; 
    }
    
    .booking-box::before { 
      content: ""; 
      position: absolute; 
      left: 0; 
      top: 0; 
      bottom: 0; 
      width: 4px; 
    }
    
    .booking-box.yellow::before { background: var(--yellow-light); }
    .booking-box.green::before { background: var(--green-light); }
    .booking-box.blue::before { background: var(--blue-light); }
    .booking-box.red::before { background: var(--red-light); }
    .booking-box.red { background: #FCF3F2; border-color: #F5C6CB; }
    
    .booking-box .title { font-weight: bold; margin-bottom: 5px; font-size: 15px; padding-left: 8px; }
    .booking-box .detail { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; padding-left: 8px; }
    
    .status-text.green { color: var(--green-light); font-weight: bold; font-size: 13px; }
    .status-text.blue { color: var(--blue-light); font-weight: bold; font-size: 13px; }
    .status-text.yellow { color: var(--yellow-light); font-weight: bold; font-size: 13px; }
    .status-text.red { color: var(--red-light); font-weight: bold; font-size: 13px; }

    /* 電子簽名畫布樣式 */
    .signature-container {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #fff;
      margin-bottom: 10px;
      overflow: hidden;
      touch-action: none; /* 防止在畫布上滾動螢幕 */
    }
    #signaturePad {
      width: 100%;
      height: 200px;
      display: block;
      cursor: crosshair;
    }
    .img-preview {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="./logo.png" alt="錦葳">
    </div>
    
    <div id="loadingMsg" class="card" style="text-align:center;">
      <h3 style="color: var(--text-muted);">連線至系統中，請稍候...</h3>
    </div>
    
    <div id="bindSection" class="card hidden">
      <h2>會員身分綁定</h2>
      <p style="color: var(--text-muted);">請輸入您的手機號碼進行驗證。未來開啟將自動登入。</p>
      <input type="tel" id="phoneInput" placeholder="例：0912345678" maxlength="10">
      <button onclick="bindAccount()">確認綁定</button>
    </div>

    <div id="mainSystem" class="hidden">
      <div class="tabs">
        <button class="tab-btn active" id="btnTab1" onclick="switchTab(1)">基本資料</button>
        <button class="tab-btn" id="btnTab4" onclick="switchTab(4)">自助報到</button>
        <button class="tab-btn" id="btnTab2" onclick="switchTab(2)">調理紀錄</button>
        <button class="tab-btn" id="btnTab3" onclick="switchTab(3)">預約專區</button>
      </div>

      <!-- 分頁 1: 基本資料 -->
      <div id="tab1" class="tab-content">
        <div class="card">
          <h2 id="displayName" style="margin-bottom: 5px;">載入中...</h2>
          <p style="margin-top:0;">
            <span class="badge" id="displayTier">一般會員</span> 
            <span class="badge" id="displayPartner">無特約</span>
          </p>
          <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 15px 0;">
          <div class="info-row">
            <div class="info-label">專屬編號</div>
            <div class="info-value" id="userJwId" style="color: var(--primary-color);"></div>
          </div>
          <div class="info-row">
            <div class="info-label">手機號碼</div>
            <div class="info-value" id="displayPhone"></div>
          </div>
          <div class="info-row" style="margin-top: 15px;">
            <div class="info-label" style="line-height: 28px;">剩餘堂數</div>
            <div class="info-value"><strong id="displayPackages" style="font-size: 22px; color: #D35400;">0</strong> 堂</div>
          </div>
          <button id="toggleEditBtn" class="btn-secondary" onclick="toggleEditForm()" style="margin-top: 15px; margin-bottom: 15px;">修改個人資料</button>

          <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 15px 0;">
          <h3 style="margin-bottom: 15px; font-size: 16px;">📝 您的預約動態</h3>
          <div id="upcomingBookingsContainer"></div>
        </div>

        <div class="card hidden" id="profileEditCard">
          <h3>修改個人資料</h3>
          <label>姓名</label>
          <input type="text" id="editName">
          
          <label>手機號碼</label>
          <input type="tel" id="editPhone" maxlength="10">
          
          <label>生日</label>
          <input type="date" id="editBirthday">
          
          <label>性別</label>
          <select id="editGender">
            <option value="">請選擇</option>
            <option value="男">男</option>
            <option value="女">女</option>
            <option value="其他">其他</option>
          </select>
          
          <button onclick="updateProfile()">儲存修改</button>
          <button class="btn-secondary" onclick="toggleEditForm()">取消修改</button>
        </div>
      </div>

      <!-- 分頁 4: 自助報到 (每次來店必填) -->
      <div id="tab4" class="tab-content hidden">
        <div class="card" id="checkInFormContainer">
          <h3>自助報到與同意書</h3>
          <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">歡迎蒞臨錦葳，為保障您的權益與提供最適合的調理服務，請據實填寫以下狀況。</p>
          
          <label>1. 開刀史、意外史、特殊疾病 (防呆：若無請填無)</label>
          <input type="text" id="chkMedicalHistory" placeholder="例如：盲腸炎開刀、高血壓... (若無請填寫「無」)">
          
          <label>2. 需避開調理的部位 (防呆：若無請填無)</label>
          <input type="text" id="chkAvoidAreas" placeholder="例如：右膝蓋、左肩... (若無請填寫「無」)">
          
          <label>3. 本次欲加強調理的部位</label>
          <input type="text" id="chkFocusAreas" placeholder="例如：肩頸緊繃、下背痠痛...">
          
          <label>4. 近期是否有新增意外撞擊、跌倒等情況？ (防呆：若無請填無)</label>
          <input type="text" id="chkRecentAccidents" placeholder="例如：上週騎車跌倒... (若無請填寫「無」)">
          
          <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 20px 0;">
          
          <label>本人同意並確認上述填寫狀況屬實：(請於下方空白處簽名)</label>
          <div class="signature-container">
            <canvas id="signaturePad"></canvas>
          </div>
          <button class="btn-small btn-secondary" onclick="clearSignature()" style="margin-bottom: 15px;">清除重簽</button>
          
          <button onclick="submitCheckIn()">確認送出報到資料</button>
        </div>
      </div>

      <!-- 分頁 2: 調理紀錄 (歷史調閱) -->
      <div id="tab2" class="tab-content hidden">
        <div class="card">
          <h3>最近調理紀錄</h3>
          <div id="historyList"></div>
        </div>
      </div>

      <!-- 分頁 3: 預約專區 -->
      <div id="tab3" class="tab-content hidden">
        <div class="card">
          <h3>預約調理</h3>
          <label>方案</label>
          <select id="serviceType">
            <option value="局部無痛滑罐-10分鐘">局部無痛滑罐-10分鐘</option>
            <option value="肩頸背套餐-15分鐘">肩頸背套餐-15分鐘</option>
            <option value="無痛滑罐放鬆-30分鐘">無痛滑罐放鬆-30分鐘</option>
            <option value="全方位滑罐放鬆-90分鐘">全方位滑罐放鬆-90分鐘</option>
            <option value="單部位舒緩修復">單部位舒緩修復</option>
            <option value="全身結構養護">全身結構養護</option>
            <option value="全身全方位深度修復-60分鐘">全身全方位深度修復-60分鐘</option>
            <option value="專案套票/多堂課程 (純購買)">專案套票/多堂課程 (純購買)</option>
            <option value="其他">其他</option>
          </select>

          <label>期望時間 1 (必填)</label>
          <div class="datetime-group">
            <input type="date" id="date1">
            <select id="time1"></select>
          </div>
          
          <label>期望時間 2 (選填)</label>
          <div class="datetime-group">
            <input type="date" id="date2">
            <select id="time2"></select>
          </div>
          
          <label>期望時間 3 (選填)</label>
          <div class="datetime-group">
            <input type="date" id="date3">
            <select id="time3"></select>
          </div>
          
          <label>狀況描述與備註 (選填)</label>
          <textarea id="bookingRemarks" rows="3" placeholder="請簡單描述狀況..."></textarea>
          
          <button onclick="submitBooking()">送出預約申請</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwApGqvuUMuERNtrlEr1NHSKxooH_fD9XF_t1v-iKg_gDJ0kRBqnrKodhjVlIWa-u16sw/exec"; 
    const LIFF_ID = "2011305352-GK5jDrbh"; 
    
    let userLineUid = "";
    let currentJwId = "";
    let currentMemberName = "";

    // 簽名板變數
    let canvas, ctx;
    let isDrawing = false;

    window.onload = function() {
      setupBookingInputs();
      initSignaturePad(); // 初始化簽名板
      
      liff.init({ liffId: LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login(); 
        } else {
          getUserDataAndLogin();
        }
      }).catch(err => { 
        document.getElementById("loadingMsg").innerHTML = "<h3>LIFF 載入失敗，請確認網路連線</h3>"; 
      });
    };

    function setupBookingInputs() {
      const todayString = new Date(new Date().getTime() - (new Date().getTimezoneOffset() * 60000)).toISOString().split('T')[0];
      
      document.getElementById("date1").min = todayString; 
      document.getElementById("date2").min = todayString; 
      document.getElementById("date3").min = todayString;
      
      let optionsHtml = '<option value="">時間</option>';
      for (let h = 9; h <= 16; h++) {
        let hour = h.toString().padStart(2, '0');
        optionsHtml += `<option value="${hour}:00">${hour}:00</option>`;
        optionsHtml += `<option value="${hour}:30">${hour}:30</option>`;
      }
      optionsHtml += `<option value="17:00">17:00</option>`;
      
      document.getElementById("time1").innerHTML = optionsHtml; 
      document.getElementById("time2").innerHTML = optionsHtml; 
      document.getElementById("time3").innerHTML = optionsHtml;
    }

    // --- 電子簽名板邏輯 ---
    function initSignaturePad() {
      canvas = document.getElementById('signaturePad');
      ctx = canvas.getContext('2d');
      
      // 設定高解析度畫布以防模糊
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';

      // 電腦滑鼠事件
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);

      // 手機觸控事件
      canvas.addEventListener('touchstart', startDrawingTouch, { passive: false });
      canvas.addEventListener('touchmove', drawTouch, { passive: false });
      canvas.addEventListener('touchend', stopDrawing);
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    
    function getTouchPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getMousePos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }
    
    function startDrawingTouch(e) {
      e.preventDefault(); // 防止滾動
      isDrawing = true;
      const pos = getTouchPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getMousePos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }
    
    function drawTouch(e) {
      e.preventDefault();
      if (!isDrawing) return;
      const pos = getTouchPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.closePath();
    }

    function clearSignature() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function isCanvasBlank() {
      const blank = document.createElement('canvas');
      blank.width = canvas.width;
      blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    }

    // --- 資料讀取邏輯 ---
    function getUserDataAndLogin() {
      liff.getProfile().then(profile => {
        userLineUid = profile.userId;
        fetch(GAS_URL, { 
          method: "POST", 
          body: JSON.stringify({ action: "autoLogin", lineUid: userLineUid }) 
        })
        .then(res => res.json())
        .then(data => {
          document.getElementById("loadingMsg").classList.add("hidden");
          if (data.status === "success") {
            renderDashboard(data); 
          } else {
            document.getElementById("bindSection").classList.remove("hidden");
          }
        }).catch(err => {
          Swal.fire('錯誤', '網路錯誤，請重新開啟。', 'error');
        });
      });
    }

    function bindAccount() {
      const phone = document.getElementById("phoneInput").value.trim();
      
      if(phone.length !== 10) { 
        Swal.fire('提示', '請輸入完整的 10 碼手機號碼！', 'warning'); 
        return; 
      }
      
      document.getElementById("bindSection").classList.add("hidden"); 
      document.getElementById("loadingMsg").classList.remove("hidden");
      document.getElementById("loadingMsg").innerHTML = "<h3>綁定資料中...</h3>";

      fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "bindAccount", lineUid: userLineUid, phone: phone }) 
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("loadingMsg").classList.add("hidden");
        if (data.status === "success") { 
          Swal.fire('成功', '綁定成功！歡迎回來', 'success'); 
          renderDashboard(data); 
        } else { 
          Swal.fire('失敗', data.message, 'error'); 
          document.getElementById("bindSection").classList.remove("hidden"); 
        }
      });
    }

    function renderDashboard(data) {
      document.getElementById("mainSystem").classList.remove("hidden");
      currentJwId = data.profile.id;
      currentMemberName = data.profile.name; // 儲存姓名供報到使用
      
      document.getElementById("displayName").textContent = data.profile.name + "，您好！";
      document.getElementById("userJwId").textContent = data.profile.id;
      document.getElementById("displayTier").textContent = data.profile.tier || "一般會員";
      document.getElementById("displayPartner").textContent = data.profile.partner ? ("特約：" + data.profile.partner) : "無特約";
      document.getElementById("displayPackages").textContent = data.profile.packages || 0;
      document.getElementById("displayPhone").textContent = data.profile.phone || "尚未填寫";
      
      if(data.profile.birthday) {
        let d = new Date(data.profile.birthday); 
        if(!isNaN(d)) {
          document.getElementById("editBirthday").value = d.toISOString().split('T')[0];
        }
      }
      
      document.getElementById("editName").value = (data.profile.name && data.profile.name.includes("新會員")) ? "" : (data.profile.name || "");
      document.getElementById("editPhone").value = data.profile.phone || "";
      document.getElementById("editGender").value = data.profile.gender || "";

      if (!data.profile.phone || !data.profile.birthday || !data.profile.gender || data.profile.name.includes("新會員")) {
        document.getElementById("profileEditCard").classList.remove("hidden"); 
        document.getElementById("toggleEditBtn").textContent = "隱藏修改表單";
      } else {
        document.getElementById("profileEditCard").classList.add("hidden"); 
        document.getElementById("toggleEditBtn").textContent = "修改個人資料";
      }

      // 渲染預約狀態
      const bookingContainer = document.getElementById("upcomingBookingsContainer");
      let bookingHtml = "";
      const allUpcoming = [];
      
      if (data.confirmedBookings) allUpcoming.push(...data.confirmedBookings);
      if (data.pendingBookings) allUpcoming.push(...data.pendingBookings);
      if (data.cancelledBookings) allUpcoming.push(...data.cancelledBookings); 
      
      if (allUpcoming.length > 0) {
        allUpcoming.forEach(b => {
          let lightColor = b.light; 
          let statusHtml = `<span class="status-text ${lightColor}">${getIcon(lightColor)} ${b.status}</span>`;
          
          let extraInfo = "";
          if (lightColor === "green" || lightColor === "blue") {
            extraInfo = `安排師傅：${b.therapist}`;
          } else if (lightColor === "yellow") {
            if (b.status === "處理改期要求中" && b.newTime) {
              extraInfo = `👉 期望新時間：<strong style="color:var(--yellow-light);">${b.newTime}</strong>`;
            } else {
              extraInfo = `請等候店鋪回覆確認`;
            }
          } else if (lightColor === "red") {
            extraInfo = `此時段無空檔，請重新預約或洽客服`;
          }

          bookingHtml += `
            <div class="booking-box ${lightColor}">
              <div class="title">${b.time} - ${b.service}</div>
              <div class="detail">${statusHtml} | ${extraInfo}</div>
              ${lightColor !== 'red' ? `
              <div style="text-align: right; padding-right: 8px;">
                <button class="btn-small btn-outline" onclick="changeBookingHandler('${b.time}', '${b.service}', 'modify')">要求改期</button>
                <button class="btn-small btn-secondary" onclick="changeBookingHandler('${b.time}', '${b.service}', 'cancel')" style="margin-left: 5px;">取消</button>
              </div>` : ''}
            </div>
          `;
        });
      } else {
        bookingHtml = "<p style='color: var(--text-muted); font-size: 14px;'>目前無未來的預約紀錄。</p>";
      }
      bookingContainer.innerHTML = bookingHtml;

      // 渲染歷史紀錄 (History View 第一優先展示報到圖檔)
      const historyContainer = document.getElementById("historyList");
      historyContainer.innerHTML = ""; 
      
      if (data.history && data.history.length > 0) {
        data.history.forEach(record => {
          let imgsHtml = "";
          if (record.checkInImg) {
             imgsHtml += `<p style="margin-bottom:5px; font-size:13px; font-weight:bold; color:var(--primary-color);">📋 當次報到紀錄表：</p>
                          <img src="${record.checkInImg}" class="img-preview" alt="報到表單">`;
          }
          if (record.beforeImg) {
             imgsHtml += `<p style="margin-bottom:5px; margin-top:10px; font-size:13px;">調理前：</p><img src="${record.beforeImg}" class="img-preview">`;
          }
          if (record.afterImg) {
             imgsHtml += `<p style="margin-bottom:5px; margin-top:10px; font-size:13px;">調理後：</p><img src="${record.afterImg}" class="img-preview">`;
          }

          historyContainer.innerHTML += `
            <div class="record-item">
              <strong>🗓️ ${record.date}</strong> | 師傅：${record.therapist}<br>
              <span style="color: var(--text-muted); font-size: 14px;">方案：${record.serviceType}</span>
              ${imgsHtml}
            </div>
          `;
        });
      } else { 
        historyContainer.innerHTML = "<p style='color: var(--text-muted);'>尚無調理紀錄。</p>"; 
      }
    }

    function getIcon(light) {
      if(light === 'green') return '✅'; 
      if(light === 'blue') return '🔵'; 
      if(light === 'red') return '❌'; 
      return '⏳';
    }

    // --- 報到影像合成與送出 ---
    function generateRandomCode() {
      return Math.random().toString(36).substring(2, 10).toUpperCase();
    }

    function submitCheckIn() {
      const medHistory = document.getElementById("chkMedicalHistory").value.trim();
      const avoidAreas = document.getElementById("chkAvoidAreas").value.trim();
      const focusAreas = document.getElementById("chkFocusAreas").value.trim();
      const recentAcc = document.getElementById("chkRecentAccidents").value.trim();

      if (!medHistory || !avoidAreas || !focusAreas || !recentAcc) {
        Swal.fire('防呆提示', '請確實填寫所有欄位，若無該狀況請手動輸入「無」喔！', 'warning');
        return;
      }
      if (isCanvasBlank()) {
        Swal.fire('防呆提示', '請在下方空白處簽名確認！', 'warning');
        return;
      }

      Swal.fire({ 
        title: '生成表單中...', 
        text: '正在加密儲存您的報到資料', 
        allowOutsideClick: false, 
        didOpen: () => { Swal.showLoading(); } 
      });

      // 原生 Canvas 渲染最終圖檔
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = 800;
      finalCanvas.height = 1000;
      const fCtx = finalCanvas.getContext('2d');

      // 繪製白底
      fCtx.fillStyle = '#FFFFFF';
      fCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

      // 繪製文字與標題
      fCtx.fillStyle = '#333333';
      fCtx.font = 'bold 32px Arial';
      fCtx.fillText('錦葳 自助報到與同意書', 40, 60);
      
      fCtx.font = '24px Arial';
      fCtx.fillText(`會員編號：${currentJwId}`, 40, 120);
      fCtx.fillText(`會員姓名：${currentMemberName}`, 40, 160);
      
      fCtx.font = 'bold 20px Arial';
      fCtx.fillText('1. 開刀史、意外史、特殊疾病：', 40, 240);
      fCtx.font = '20px Arial';
      fCtx.fillText(medHistory, 60, 280);

      fCtx.font = 'bold 20px Arial';
      fCtx.fillText('2. 需避開調理的部位：', 40, 340);
      fCtx.font = '20px Arial';
      fCtx.fillText(avoidAreas, 60, 380);

      fCtx.font = 'bold 20px Arial';
      fCtx.fillText('3. 本次欲加強調理的部位：', 40, 440);
      fCtx.font = '20px Arial';
      fCtx.fillText(focusAreas, 60, 480);

      fCtx.font = 'bold 20px Arial';
      fCtx.fillText('4. 近期新增意外撞擊、跌倒情況：', 40, 540);
      fCtx.font = '20px Arial';
      fCtx.fillText(recentAcc, 60, 580);

      fCtx.font = 'bold 22px Arial';
      fCtx.fillText('本人同意並確認上述填寫狀況屬實，特此簽名：', 40, 680);

      // 繪製簽名圖
      fCtx.drawImage(canvas, 40, 720, 400, 200);

      // 壓上浮水印 (時間戳記與驗證碼)
      const now = new Date();
      const tzOffset = now.getTimezoneOffset() * 60000;
      const localISOTime = (new Date(now.getTime() - tzOffset)).toISOString().slice(0, 19).replace('T', ' ');
      const randomCode = generateRandomCode();

      fCtx.fillStyle = '#999999';
      fCtx.font = '16px Arial';
      fCtx.fillText(`認證時間：${localISOTime}`, 500, 940);
      fCtx.fillText(`認證序號：${randomCode}`, 500, 970);

      // 轉換為 Base64
      const base64Image = finalCanvas.toDataURL('image/jpeg', 0.8);

      // 送出至後端
      fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ 
          action: "submitCheckIn", 
          memberId: currentJwId, 
          memberName: currentMemberName,
          base64Image: base64Image,
          randomCode: randomCode
        }) 
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          Swal.fire('報到成功', '已為您完成本次報到手續！', 'success');
          // 清空表單
          document.getElementById("chkMedicalHistory").value = "";
          document.getElementById("chkAvoidAreas").value = "";
          document.getElementById("chkFocusAreas").value = "";
          document.getElementById("chkRecentAccidents").value = "";
          clearSignature();
          switchTab(2); // 自動跳轉至歷史紀錄
          getUserDataAndLogin(); // 重新讀取資料
        } else {
          Swal.fire('錯誤', data.message, 'error');
        }
      })
      .catch(err => Swal.fire('錯誤', '網路連線異常，請稍後再試。', 'error'));
    }

    // --- 其他表單操作邏輯保持不變 ---
    function changeBookingHandler(timeStr, serviceStr, actionType) {
      if (actionType === "modify") {
        let timeOptions = '<option value="">時間</option>';
        for (let h = 9; h <= 16; h++) {
          let hour = h.toString().padStart(2, '0');
          timeOptions += `<option value="${hour}:00">${hour}:00</option>`;
          timeOptions += `<option value="${hour}:30">${hour}:30</option>`;
        }
        timeOptions += `<option value="17:00">17:00</option>`;

        Swal.fire({
          title: '申請改期',
          html: `
            <p style="font-size:14px; color:#8C7B70;">原預約：${timeStr}<br>方案：${serviceStr}</p>
            <p style="font-size:15px; margin-bottom:5px; text-align:left;">請選擇您期望的新日期與時間：</p>
            <div style="display:flex; gap:10px;">
              <input type="date" id="swal-date" class="swal2-input" style="margin:0; width:50%; font-size:15px;">
              <select id="swal-time" class="swal2-select" style="margin:0; width:50%; display:flex; font-size:15px;">
                ${timeOptions}
              </select>
            </div>
          `,
          showCancelButton: true, 
          confirmButtonText: '送出改期要求', 
          cancelButtonText: '返回', 
          confirmButtonColor: '#B9936C',
          didOpen: () => { 
            document.getElementById('swal-date').min = new Date(new Date().getTime() - (new Date().getTimezoneOffset() * 60000)).toISOString().split('T')[0]; 
          },
          preConfirm: () => {
            const date = document.getElementById('swal-date').value;
            const time = document.getElementById('swal-time').value;
            if (!date || !time) { 
              Swal.showValidationMessage('請完整選擇新的日期與時間喔！'); 
              return false; 
            }
            return `${date} ${time}`;
          }
        }).then((result) => { 
          if (result.isConfirmed) { 
            sendChangeRequest(timeStr, serviceStr, actionType, result.value); 
          } 
        });
      } else {
        Swal.fire({
          title: '確認取消預約？', 
          text: `原預約：${timeStr} (${serviceStr})`, 
          icon: 'warning', 
          input: 'text', 
          inputPlaceholder: '可簡單描述取消原因 (選填)',
          showCancelButton: true, 
          confirmButtonText: '確定取消', 
          cancelButtonText: '返回', 
          confirmButtonColor: '#d33'
        }).then((result) => { 
          if (result.isConfirmed) { 
            sendChangeRequest(timeStr, serviceStr, actionType, result.value || "無提供原因"); 
          } 
        });
      }
    }

    function sendChangeRequest(timeStr, serviceStr, actionType, userMessage) {
      document.getElementById("loadingMsg").classList.remove("hidden"); 
      document.getElementById("mainSystem").classList.add("hidden");
      
      fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ 
          action: "changeBooking", 
          memberId: currentJwId, 
          bookingTime: timeStr, 
          serviceType: serviceStr, 
          changeType: actionType, 
          userMessage: userMessage 
        }) 
      })
      .then(res => res.json())
      .then(data => { 
        getUserDataAndLogin(); 
        Swal.fire('已送出', '系統已同步更新您的需求，請稍待店務人員回覆😌', 'success'); 
      })
      .catch(err => { 
        Swal.fire('錯誤', '網路錯誤，請稍後再試。', 'error'); 
        getUserDataAndLogin(); 
      });
    }

    function toggleEditForm() {
      const editCard = document.getElementById("profileEditCard");
      const toggleBtn = document.getElementById("toggleEditBtn");
      
      if (editCard.classList.contains("hidden")) { 
        editCard.classList.remove("hidden"); 
        toggleBtn.textContent = "隱藏修改表單"; 
      } else { 
        editCard.classList.add("hidden"); 
        toggleBtn.textContent = "修改個人資料"; 
      }
    }

    function updateProfile() {
      const name = document.getElementById("editName").value;
      const phone = document.getElementById("editPhone").value;
      const birthday = document.getElementById("editBirthday").value;
      const gender = document.getElementById("editGender").value;
      
      if (!name.trim()) { 
        Swal.fire('提示', '請輸入您的姓名！', 'warning'); 
        return; 
      }
      
      fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ 
          action: "updateProfile", 
          memberId: currentJwId, 
          name: name, 
          phone: phone, 
          birthday: birthday, 
          gender: gender 
        }) 
      })
      .then(res => res.json())
      .then(data => { 
        if (data.status === "success") { 
          Swal.fire('成功', '資料更新成功！', 'success'); 
          renderDashboard(data); 
        } else { 
          Swal.fire('錯誤', data.message, 'error'); 
        } 
      });
    }

    function submitBooking() {
      const date1 = document.getElementById("date1").value;
      const time1 = document.getElementById("time1").value;
      const date2 = document.getElementById("date2").value;
      const time2 = document.getElementById("time2").value;
      const date3 = document.getElementById("date3").value;
      const time3 = document.getElementById("time3").value;
      const serviceType = document.getElementById("serviceType").value;
      const remarks = document.getElementById("bookingRemarks").value; 
      
      if (!date1 || !time1) { 
        Swal.fire('提示', '期望時間 1 為必填！', 'warning'); 
        return; 
      }

      const fullTime1 = `${date1} ${time1}`;
      const fullTime2 = (date2 && time2) ? `${date2} ${time2}` : "";
      const fullTime3 = (date3 && time3) ? `${date3} ${time3}` : "";
      
      Swal.fire({ 
        title: '處理中...', 
        text: '正在送出您的預約', 
        allowOutsideClick: false, 
        didOpen: () => { Swal.showLoading(); } 
      });

      fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ 
          action: "submitBooking", 
          memberId: currentJwId, 
          time1: fullTime1, 
          time2: fullTime2, 
          time3: fullTime3, 
          serviceType: serviceType, 
          remarks: remarks 
        }) 
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          Swal.fire('申請已送出', '我們會盡快確認您的預約時間。', 'success');
          document.getElementById("date1").value = ""; 
          document.getElementById("time1").value = ""; 
          document.getElementById("date2").value = ""; 
          document.getElementById("time2").value = ""; 
          document.getElementById("date3").value = ""; 
          document.getElementById("time3").value = ""; 
          document.getElementById("bookingRemarks").value = ""; 
          
          document.getElementById("loadingMsg").classList.remove("hidden"); 
          document.getElementById("mainSystem").classList.add("hidden");
          getUserDataAndLogin();
        } else { 
          Swal.fire('錯誤', data.message, 'error'); 
        }
      });
    }

    function switchTab(tabIndex) {
      document.querySelectorAll('.tab-content').forEach(el => {
        el.classList.add('hidden');
      }); 
      
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('active');
      });
      
      document.getElementById('tab' + tabIndex).classList.remove('hidden'); 
      document.getElementById('btnTab' + tabIndex).classList.add('active');
    }
  </script>
</body>
</html>
