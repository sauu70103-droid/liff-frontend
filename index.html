<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錦葳專屬會員系統</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg-color: #F8F6F1;
      --card-bg: #FFFFFF;
      --primary-color: #B9936C;
      --primary-hover: #9E7A55;
      --text-main: #4A3B32;
      --text-muted: #8C7B70;
      --border-color: #E2D3C5;
    }
    body { font-family: '微軟正黑體', sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: var(--text-main); }
    .container { max-width: 500px; margin: 0 auto; }
    
    .logo-container { text-align: center; margin-bottom: 20px; }
    /* 移除 mix-blend-mode，讓透明 PNG 自然顯示 */
    .logo-container img { max-width: 160px; height: auto; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(139, 111, 88, 0.1); }
    h2, h3 { margin-top: 0; color: var(--text-main); }
    
    input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border-color); box-sizing: border-box; font-size: 16px; color: var(--text-main); background: #faf8f5;}
    input:focus, select:focus { outline: none; border-color: var(--primary-color); }
    
    button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
    button:hover { background-color: var(--primary-hover); }
    
    .badge { display: inline-block; padding: 4px 10px; background: #EFE4DA; color: var(--text-main); border-radius: 6px; font-size: 13px; font-weight: bold; border: 1px solid var(--primary-color); }
    .hidden { display: none !important; }

    .tabs { display: flex; justify-content: space-between; margin-bottom: 20px; background: var(--card-bg); border-radius: 12px; padding: 5px; box-shadow: 0 2px 5px rgba(139, 111, 88, 0.1); }
    .tab-btn { flex: 1; background: transparent; color: var(--text-muted); border: none; margin-bottom: 0; padding: 10px 0; border-radius: 8px; }
    .tab-btn.active { background: var(--primary-color); color: white; }
    
    .record-item { border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
    .record-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 頂部純粹 Logo：讀取 GitHub 上的 logo.png -->
    <div class="logo-container">
      <img src="./logo.png" alt="錦葳">
    </div>

    <div id="loadingMsg" class="card" style="text-align:center;">
      <h3 style="color: var(--text-muted);">連線至系統中，請稍候...</h3>
    </div>

    <div id="bindSection" class="card hidden">
      <h2>會員身分綁定</h2>
      <p style="color: var(--text-muted);">請輸入您的手機號碼進行驗證。未來開啟將自動登入。</p>
      <input type="tel" id="phoneInput" placeholder="例：0912345678" maxlength="10">
      <button onclick="bindAccount()">確認綁定</button>
    </div>

    <div id="mainSystem" class="hidden">
      
      <div class="tabs">
        <button class="tab-btn active" id="btnTab1" onclick="switchTab(1)">基本資料</button>
        <button class="tab-btn" id="btnTab2" onclick="switchTab(2)">調理紀錄</button>
        <button class="tab-btn" id="btnTab3" onclick="switchTab(3)">預約專區</button>
      </div>

      <div id="tab1" class="tab-content">
        <div class="card">
          <h2 id="displayName" style="margin-bottom: 5px;">載入中...</h2>
          <p style="margin-top:0;"><span class="badge" id="displayTier">一般會員</span> <span class="badge" id="displayPartner">無特約</span></p>
          <p>您的專屬編號：<span id="userJwId" style="color: var(--primary-color); font-weight:bold;"></span></p>
          <p>剩餘調理堂數：<strong id="displayPackages" style="font-size: 22px; color: #D35400;">0</strong> 堂</p>
        </div>

        <div class="card">
          <h3>修改個人資料</h3>
          <label>姓名</label>
          <input type="text" id="editName">
          <label>手機號碼</label>
          <input type="tel" id="editPhone" maxlength="10">
          <label>生日</label>
          <input type="date" id="editBirthday">
          <label>性別</label>
          <select id="editGender">
            <option value="">請選擇</option>
            <option value="男">男</option>
            <option value="女">女</option>
            <option value="其他">其他</option>
          </select>
          <button onclick="updateProfile()">儲存修改</button>
        </div>
      </div>

      <div id="tab2" class="tab-content hidden">
        <div class="card">
          <h3>最近調理紀錄</h3>
          <div id="historyList"></div>
        </div>
      </div>

      <div id="tab3" class="tab-content hidden">
        <div class="card">
          <h3>申請預約調理</h3>
          <label>期望方案</label>
          <select id="serviceType">
            <option value="全身調理">全身調理</option>
            <option value="無痛滑罐">無痛滑罐</option>
            <option value="單部位放鬆">單部位放鬆</option>
          </select>
          <label>期望時間 1 (必填)</label>
          <input type="datetime-local" id="time1">
          <label>期望時間 2 (選填)</label>
          <input type="datetime-local" id="time2">
          <label>期望時間 3 (選填)</label>
          <input type="datetime-local" id="time3">
          <button onclick="submitBooking()">送出預約申請</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwApGqvuUMuERNtrlEr1NHSKxooH_fD9XF_t1v-iKg_gDJ0kRBqnrKodhjVlIWa-u16sw/exec"; 
    const LIFF_ID = "2011305352-GK5jDrbh"; 
    
    let userLineUid = "";
    let currentJwId = "";

    window.onload = function() {
      liff.init({ liffId: LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login(); 
        } else {
          getUserDataAndLogin();
        }
      }).catch(err => {
        document.getElementById("loadingMsg").innerHTML = "<h3>LIFF 載入失敗</h3>";
      });
    };

    function getUserDataAndLogin() {
      liff.getProfile().then(profile => {
        userLineUid = profile.userId;
        fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "autoLogin", lineUid: userLineUid })
        })
        .then(res => res.json())
        .then(data => {
          document.getElementById("loadingMsg").classList.add("hidden");
          if (data.status === "success") {
            renderDashboard(data);
          } else {
            document.getElementById("bindSection").classList.remove("hidden");
          }
        }).catch(err => alert("網路錯誤"));
      });
    }

    function bindAccount() {
      const phone = document.getElementById("phoneInput").value.trim();
      if(phone.length !== 10) { alert("請輸入完整的 10 碼手機號碼！"); return; }
      
      document.getElementById("bindSection").classList.add("hidden");
      document.getElementById("loadingMsg").classList.remove("hidden");
      document.getElementById("loadingMsg").innerHTML = "<h3>綁定資料中...</h3>";

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "bindAccount", lineUid: userLineUid, phone: phone })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("loadingMsg").classList.add("hidden");
        if (data.status === "success") {
          alert("綁定成功！");
          renderDashboard(data);
        } else {
          alert("綁定失敗：" + data.message);
          document.getElementById("bindSection").classList.remove("hidden");
        }
      });
    }

    function renderDashboard(data) {
      document.getElementById("mainSystem").classList.remove("hidden");
      currentJwId = data.profile.id;
      
      document.getElementById("displayName").textContent = data.profile.name + "，您好！";
      document.getElementById("userJwId").textContent = data.profile.id;
      document.getElementById("displayTier").textContent = data.profile.tier || "一般會員";
      document.getElementById("displayPartner").textContent = data.profile.partner ? ("特約：" + data.profile.partner) : "無特約";
      document.getElementById("displayPackages").textContent = data.profile.packages || 0;
      
      document.getElementById("editName").value = data.profile.name || "";
      document.getElementById("editPhone").value = data.profile.phone || "";
      if(data.profile.birthday) {
        let d = new Date(data.profile.birthday);
        if(!isNaN(d)) document.getElementById("editBirthday").value = d.toISOString().split('T')[0];
      }
      document.getElementById("editGender").value = data.profile.gender || "";

      const historyContainer = document.getElementById("historyList");
      historyContainer.innerHTML = ""; 
      if (data.history && data.history.length > 0) {
        data.history.forEach(record => {
          historyContainer.innerHTML += `
            <div class="record-item">
              <strong>🗓️ ${record.date}</strong> | ${record.therapist}<br>
              <span style="color: var(--text-muted); font-size: 14px;">方案：${record.serviceType}</span><br>
              <div style="margin-top: 5px;">
                ${record.beforeImg ? `<a href="${record.beforeImg}" target="_blank" style="font-size: 13px; color: var(--primary-color);">查看調理前</a>` : ''}
                ${record.afterImg ? ` | <a href="${record.afterImg}" target="_blank" style="font-size: 13px; color: var(--primary-color);">查看調理後</a>` : ''}
              </div>
            </div>
          `;
        });
      } else {
        historyContainer.innerHTML = "<p style='color: var(--text-muted);'>尚無調理紀錄。</p>";
      }
    }

    function updateProfile() {
      const name = document.getElementById("editName").value;
      const phone = document.getElementById("editPhone").value;
      const birthday = document.getElementById("editBirthday").value;
      const gender = document.getElementById("editGender").value;

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "updateProfile", memberId: currentJwId,
          name: name, phone: phone, birthday: birthday, gender: gender
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("資料更新成功！");
          renderDashboard(data); 
        } else {
          alert("錯誤：" + data.message);
        }
      });
    }

    function submitBooking() {
      const time1 = document.getElementById("time1").value;
      const time2 = document.getElementById("time2").value;
      const time3 = document.getElementById("time3").value;
      const serviceType = document.getElementById("serviceType").value;

      if (!time1) { alert("請至少填寫一個期望時間！"); return; }

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitBooking", memberId: currentJwId,
          time1: time1, time2: time2, time3: time3, serviceType: serviceType
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("預約申請已送出！");
          document.getElementById("time1").value = "";
          document.getElementById("time2").value = "";
          document.getElementById("time3").value = "";
        } else { alert("錯誤：" + data.message); }
      });
    }

    function switchTab(tabIndex) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab' + tabIndex).classList.remove('hidden');
      document.getElementById('btnTab' + tabIndex).classList.add('active');
    }
  </script>
</body>
</html>
