<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>錦葳專屬會員系統</title>
  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* CSS 外觀樣式設定 */
    body { font-family: '微軟正黑體', sans-serif; background-color: #f4f5f7; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2, h3 { margin-top: 0; color: #2c3e50; }
    input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
    button { background-color: #2c3e50; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #1a252f; }
    .record-item { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
    .record-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .badge { display: inline-block; padding: 4px 8px; background: #e8f4f8; color: #007bb5; border-radius: 4px; font-size: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 狀態顯示區 -->
    <div id="loadingMsg" class="card" style="text-align:center; color: #666;">
      <h3>連線至錦葳系統中，請稍候...</h3>
    </div>

    <!-- 區塊 1：首次綁定區 -->
    <div id="bindSection" class="card hidden">
      <h2>會員身分綁定</h2>
      <p>系統偵測到您是首次使用，請輸入您的會員編號進行綁定。未來開啟將自動登入。</p>
      <input type="text" id="memberIdInput" placeholder="例如：JW0912345678">
      <button onclick="bindAccount()">確認綁定</button>
    </div>

    <!-- 區塊 2：會員儀表板 -->
    <div id="dashboardSection" class="hidden">
      
      <!-- 頂級會員卡 -->
      <div class="card">
        <h2 id="displayName">會員姓名</h2>
        <p><span class="badge" id="displayTier">一般會員</span> <span class="badge" id="displayPartner">無特約</span></p>
        <p>您的專屬編號：<span id="userJwId"></span></p>
        <p>剩餘調理堂數：<strong id="displayPackages" style="font-size: 20px; color: #e74c3c;">0</strong> 堂</p>
      </div>

      <!-- 最近三次調理紀錄 -->
      <div class="card">
        <h3>最近調理紀錄</h3>
        <div id="historyList">
          <!-- 紀錄會由 JavaScript 動態產生 -->
        </div>
      </div>

      <!-- 預約表單 -->
      <div class="card">
        <h3>申請預約調理</h3>
        <label>期望方案</label>
        <select id="serviceType">
          <option value="全身調理">全身調理</option>
          <option value="無痛滑罐">無痛滑罐</option>
          <option value="單部位放鬆">單部位放鬆</option>
        </select>
        <label>期望時間 1 (必填)</label>
        <input type="datetime-local" id="time1">
        <label>期望時間 2 (選填)</label>
        <input type="datetime-local" id="time2">
        <label>期望時間 3 (選填)</label>
        <input type="datetime-local" id="time3">
        <button onclick="submitBooking()">送出預約申請</button>
      </div>

    </div>
  </div>

  <script>
    /**
     * ==========================================
     * 參數設定區
     * ==========================================
     */
    // 已經為你更新好的 GAS API 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwApGqvuUMuERNtrlEr1NHSKxooH_fD9XF_t1v-iKg_gDJ0kRBqnrKodhjVlIWa-u16sw/exec"; 
    
    // 已經為你更新好的專屬 LIFF ID
    const LIFF_ID = "2011305352-GK5jDrbh"; 
    
    // 全域變數
    let userLineUid = "";
    let currentJwId = "";

    // 1. 初始化 LIFF SDK
    window.onload = function() {
      liff.init({ liffId: LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login(); 
        } else {
          getUserDataAndLogin();
        }
      }).catch(err => {
        document.getElementById("loadingMsg").innerHTML = "<h3>LIFF 初始化失敗</h3><p>" + err + "</p>";
      });
    };

    // 2. 取得 LINE UID 並向後端請求自動登入
    function getUserDataAndLogin() {
      liff.getProfile().then(profile => {
        userLineUid = profile.userId;
        
        fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "autoLogin", lineUid: userLineUid })
        })
        .then(res => res.json())
        .then(data => {
          document.getElementById("loadingMsg").classList.add("hidden");
          
          if (data.status === "success") {
            // 自動登入成功
            renderDashboard(data);
          } else {
            // 沒找到資料，顯示綁定畫面
            document.getElementById("bindSection").classList.remove("hidden");
          }
        }).catch(err => {
          document.getElementById("loadingMsg").innerHTML = "<h3>網路連線錯誤</h3><p>無法連線至後端系統。</p>";
        });
      });
    }

    // 3. 手動綁定函式
    function bindAccount() {
      const jwId = document.getElementById("memberIdInput").value.trim();
      if(!jwId) { alert("請輸入 JW 會員編號！"); return; }
      
      document.getElementById("bindSection").classList.add("hidden");
      document.getElementById("loadingMsg").classList.remove("hidden");
      document.getElementById("loadingMsg").innerHTML = "<h3>綁定資料中，請稍候...</h3>";

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "bindAccount", lineUid: userLineUid, memberId: jwId })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("loadingMsg").classList.add("hidden");
        if (data.status === "success") {
          alert("綁定成功！");
          renderDashboard(data);
        } else {
          alert("綁定失敗：" + data.message);
          document.getElementById("bindSection").classList.remove("hidden");
        }
      }).catch(err => {
        alert("網路錯誤，綁定失敗。");
        document.getElementById("loadingMsg").classList.add("hidden");
        document.getElementById("bindSection").classList.remove("hidden");
      });
    }

    // 4. 將資料渲染至會員儀表板
    function renderDashboard(data) {
      document.getElementById("dashboardSection").classList.remove("hidden");
      
      // 更新基本資料
      document.getElementById("displayName").textContent = data.profile.name + "，您好！";
      document.getElementById("userJwId").textContent = data.profile.id;
      document.getElementById("displayTier").textContent = data.profile.tier || "一般會員";
      document.getElementById("displayPartner").textContent = data.profile.partner ? ("特約：" + data.profile.partner) : "無特約";
      document.getElementById("displayPackages").textContent = data.profile.packages || 0;
      
      currentJwId = data.profile.id; // 存下 JW ID 供預約功能使用

      // 更新歷史紀錄列表
      const historyContainer = document.getElementById("historyList");
      historyContainer.innerHTML = ""; 
      
      if (data.history && data.history.length > 0) {
        data.history.forEach(record => {
          const htmlString = `
            <div class="record-item">
              <strong>🗓️ ${record.date}</strong> | 負責師傅：${record.therapist}<br>
              <span style="color: #7f8c8d; font-size: 14px;">方案：${record.serviceType}</span><br>
              <div style="margin-top: 5px;">
                ${record.beforeImg ? `<a href="${record.beforeImg}" target="_blank" style="font-size: 12px; color: blue;">查看調理前原圖</a>` : ''}
                ${record.afterImg ? ` | <a href="${record.afterImg}" target="_blank" style="font-size: 12px; color: blue;">查看調理後原圖</a>` : ''}
              </div>
            </div>
          `;
          historyContainer.innerHTML += htmlString;
        });
      } else {
        historyContainer.innerHTML = "<p style='color: #999; font-size: 14px;'>尚無調理紀錄。</p>";
      }
    }

    // 5. 送出預約申請
    function submitBooking() {
      const time1 = document.getElementById("time1").value;
      const time2 = document.getElementById("time2").value;
      const time3 = document.getElementById("time3").value;
      const serviceType = document.getElementById("serviceType").value;

      if (!time1) {
        alert("請至少填寫一個期望時間！");
        return;
      }

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitBooking",
          memberId: currentJwId,
          time1: time1,
          time2: time2,
          time3: time3,
          serviceType: serviceType
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          alert("預約申請已送出！我們會盡快與您聯繫。");
          // 清空時間欄位
          document.getElementById("time1").value = "";
          document.getElementById("time2").value = "";
          document.getElementById("time3").value = "";
        } else {
          alert("錯誤：" + data.message);
        }
      })
      .catch(error => {
        alert("網路連線發生錯誤，請稍後再試。");
      });
    }
  </script>
</body>
</html>
